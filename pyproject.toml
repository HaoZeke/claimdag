[project]
name = "claimdag-tui"
version = "0.1.0"
description = "Textual WorkGraph over a claimdag work.json"
requires-python = ">=3.11"
license = { text = "Apache-2.0 OR MIT" }
dependencies = ["textual>=0.86"]

[project.scripts]
claimdag-tui = "claimdag_tui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claimdag_tui"]
