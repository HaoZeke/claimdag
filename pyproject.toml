[project]
name = "claimdag-tui"
version = "0.1.0"
description = "Textual WorkGraph over a claimdag work.bin"
requires-python = ">=3.11"
license = { text = "Apache-2.0 OR MIT" }
dependencies = ["textual>=0.86"]

[project.scripts]
claimdag-tui = "claimdag_tui.app:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claimdag_tui"]

[tool.hatch.build.targets.wheel.force-include]
"claimdag_tui/tokyo_night_storm.tcss" = "claimdag_tui/tokyo_night_storm.tcss"
"claimdag_tui/storm.tcss" = "claimdag_tui/storm.tcss"

[tool.pytest.ini_options]
testpaths = ["tests"]
